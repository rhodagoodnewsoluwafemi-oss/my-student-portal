<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result Checker</title>

    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main class="container">
        <section class="result-card">
            <h1>Student Result Checker</h1>

            <p class="description">
                Enter the student's name and score
                to check their grade.
            </p>

            <form id="result-form">
                <label for="student-name">Student Name</label>
                <input
                    type="text"
                    id="student-name"
                    placeholder="Enter student's name"
                >

                <label for="student-score">Student Score</label>
                <input
                    type="number"
                    id="student-score"
                    placeholder="Enter marks score from 0 to 100"
                >

                <button type="submit" id="check-btn">
                    Check Result
                </button>

            </form>

            <p id="message" role="status" aria-live="polite"></p>

            <div id="result"></div>

        </section>

    </main>

    <script src="index.js"></script>
</body>
</html>
